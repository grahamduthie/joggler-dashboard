server {
    listen 80;
    listen [::]:80;
    server_name nearby.gdx.org.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nearby.gdx.org.uk;
    ssl_certificate /etc/letsencrypt/live/nearby.gdx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nearby.gdx.org.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / { proxy_pass http://127.0.0.1:8002/nearby; }
    location = /api/radio/stream {
        proxy_pass http://127.0.0.1:8002;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
