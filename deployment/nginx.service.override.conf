# Shared-VM systemd drop-in, NOT deployed by cloud-deploy.sh (it's cross-app infra, not
# Joggler-specific). Install manually on cloud.gdx.org.uk:
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo cp deployment/nginx.service.override.conf /etc/systemd/system/nginx.service.d/override.conf
#   sudo systemctl daemon-reload
#
# Added 2026-09-11 after nginx sat crashed for ~90 minutes (Restart=no by default) when an
# unattended-upgrades libc6 restart raced certbot's renewal restart and lost a port-bind race.
# See CLOUD-MIGRATION-PLAN.md change log for the full incident. StartLimitBurst/IntervalUSec are
# left at systemd's defaults (5 restarts per 10s), so a genuine crash loop still gives up loudly
# instead of masking a real misconfiguration.
[Service]
Restart=on-failure
RestartSec=2s
