server {
    listen 80;
    listen [::]:80;
    server_name dashboard.gdx.org.uk;

    location = /now { return 302 https://nearby.gdx.org.uk/now; }
    location = /lineside { return 302 https://nearby.gdx.org.uk/lineside; }
    location = /aircraft { return 302 https://nearby.gdx.org.uk/aircraft; }
    location = /trains { return 302 https://nearby.gdx.org.uk/trains; }
    location / { return 301 https://$host$request_uri; }
}
